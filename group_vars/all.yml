---
cis_level: 1
cis_enable_level2: false
cis_reboot_allowed: false
cis_install_security_updates_automatically: false
cis_aide_init_database: false
cis_allow_root_ssh: false
cis_password_max_days: 365
cis_password_min_days: 1
cis_password_warn_age: 7
cis_password_inactive_lock: 30
cis_password_minlen: 14
cis_password_minclass: 4
cis_password_remember: 24
cis_faillock_deny: 5
cis_faillock_unlock_time: 900
cis_faillock_fail_interval: 900
cis_authselect_profile: local
cis_authselect_feature_strict: true
cis_sudo_logfile: /var/log/sudo.log
cis_sudo_use_pty: true
cis_firewalld_zone: public
cis_firewalld_target: DROP
cis_firewalld_services:
  - ssh
cis_firewalld_ports: []
cis_selinux_state: enforcing
cis_selinux_policy: targeted
cis_local_admin_groups:
  - wheel
cis_local_users: []
cis_ssh_allow_users: []
cis_ssh_allow_groups: []
audit_set_immutable: false
oscap_content_path: /usr/share/xml/scap/ssg/content/ssg-ol10-ds.xml
oscap_datastream_path_override: ""
oscap_profile_id: ""
oscap_tailoring_path: ""
oscap_fail_when_cis_profile_missing: true
oscap_validate_datastream: true
oscap_enable_timer: true
oscap_use_cron: false
oscap_timer_on_calendar: "Sun *-*-* 02:00:00"
oscap_cron_minute: "0"
oscap_cron_hour: "2"
oscap_cron_weekday: "0"
oscap_report_dir: /var/log/oscap
oscap_manifest_path: /var/log/oscap/latest.env
oscap_retention_days: 30
oscap_run_immediate_scan: false
oscap_generate_ansible_fix: true
oscap_generate_bash_fix: true
oscap_apply_remediation_during_scan: false
oscap_collect_artifacts: false
oscap_local_artifact_dir: ""
oscap_additional_eval_args: []
oscap_profile_candidates_level1:
  - xccdf_org.ssgproject.content_profile_cis_server_l1
  - xccdf_org.ssgproject.content_profile_cis
oscap_profile_candidates_level2:
  - xccdf_org.ssgproject.content_profile_cis_server_l2
  - xccdf_org.ssgproject.content_profile_cis_workstation_l2
