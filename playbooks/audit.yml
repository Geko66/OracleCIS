  - name: Audit 1.1.1.11 - Ensure unused filesystems kernel modules are not available
    tags:
    - Level1
    - Server
    - 1_1_1_11
    block:
    - name: Document audit intent for 1.1.1.11
      ansible.builtin.debug:
        msg: Ensure unused filesystems kernel modules are not available [1.1.1.11]
    - name: Execute audit commands for 1.1.1.11
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          #!/usr/bin/env bash

          {
           a_output=() a_output2=() a_output3=() a_module=()
           l_search="$(readlink -e /usr/lib/modules/ || readlink -e /lib/modules/)"
           l_mounted="$(findmnt -Dkerno fstype | sort -u 2>/dev/null || true)"
           l_lsmod="$(lsmod | awk 'NR > 1 {print $1}' 2>/dev/null || true)"
           l_showconfig="$(modprobe --showconfig 2>/dev/null || true)"
           while IFS= read -r -d $'\0' l_module_dir; do
           if [ ! "$(basename "$l_module_dir")" = "nls" ]; then
           while IFS= read -r -d $'\0' l_module_file; do
           l_mname="$(basename "$l_module_file" | cut -d'.' -f1)"
           if [ -f "$l_module_file" ] && ! grep -Psiq -- '\b'"$l_mname"'\b' <<< "${a_module[*]}"; then
           a_module+=("$l_mname")
           fi
           done < <(find -L "$l_module_dir" -mindepth 1 -maxdepth 1 -type f -print0)
           fi
           done < <(find "$l_search"/**/kernel/fs/ -mindepth 1 -maxdepth 1 -type d ! -empty -print0)
           for l_module in "${a_module[@]}"; do
           if grep -Psoiq -- '\b'"$l_module"'\b' <<< "$l_mounted"; then
           a_output+=(" - \"$l_module\"")
           elif grep -Psoiq -- '\b'"$l_module"'\b' <<< "$l_lsmod"; then
           a_output2+=(" - \"$l_module\"")
           elif ! grep -Psioq -- '\binstall\h+'"${l_module//-/_}"'\h+\H+\b' <<< "$l_showconfig" && \
           ! grep -Psioq -- '\bblacklist\h+'"${l_module//-/_}"'\b' <<< "$l_showconfig"; then
           a_output3+=(" - \"$l_module\"")
           fi
           done
           [ "${#a_output[@]}" -gt 0 ] && printf '%s\n' "" \
           "- There are \"${#a_output[@]}\" kernel modules currently mounted:" "${a_output[@]}"
           [ "${#a_output2[@]}" -gt 0 ] && printf '%s\n' "" \
           "- There are \"${#a_output2[@]}\" kernel modules currently loaded:" "${a_output2[@]}"
           [ "${#a_output3[@]}" -gt 0 ] && printf '%s\n' "" \
           "- There are \"${#a_output3[@]}\" Kernel modules currently loadable:" "${a_output3[@]}"
          }
          {% endraw %}
      args:
        executable: /bin/bash
      register: audit_1_1_1_11
      changed_when: false
      failed_when: false
