  - name: Set audit report artifact paths
    ansible.builtin.set_fact:
      audit_report_timestamp: "{{ ansible_date_time.iso8601_basic_short }}"
      audit_report_artifact_dir: "{{ playbook_dir }}/../artifacts/audit-report/{{ inventory_hostname }}"
      audit_report_json_path: "{{ playbook_dir }}/../artifacts/audit-report/{{ inventory_hostname }}/audit-{{ ansible_date_time.iso8601_basic_short }}.json"
      audit_report_html_path: "{{ playbook_dir }}/../artifacts/audit-report/{{ inventory_hostname }}/audit-{{ ansible_date_time.iso8601_basic_short }}.html"

  - name: Ensure audit report artifact directory exists
    ansible.builtin.file:
      path: "{{ audit_report_artifact_dir }}"
      state: directory
      mode: "0755"
    delegate_to: localhost
    become: false

  - name: Extract audit control metadata from the playbook
    ansible.builtin.shell:
      cmd: |
        awk '
          /msg: .* \[[0-9.]+\]$/ {
            line=$0
            sub(/^[[:space:]]*msg: /, "", line)
            control=line
            sub(/^.* \[/, "", control)
            sub(/\]$/, "", control)
            title=line
            sub(/ \[[0-9.]+\]$/, "", title)
            pending_title=title
            pending_control=control
            next
          }
          /^[[:space:]]*register: audit_/ && pending_control != "" {
            printf "%s\t%s\t%s\n", $2, pending_control, pending_title
            pending_title=""
            pending_control=""
          }
        ' "{{ playbook_dir }}/audit.yml"
    register: audit_metadata_raw
    changed_when: false
    delegate_to: localhost
    become: false

  - name: Initialize audit control metadata map
    ansible.builtin.set_fact:
      audit_control_metadata: {}
      
  - name: Build audit control metadata map
    ansible.builtin.set_fact:
      audit_control_metadata: "{{ audit_control_metadata | default({}) | combine({ parts[0]: {'control_id': parts[1], 'title': parts[2]} }) }}"
    vars:
      parts: "{{ item.split('\t') }}"
    loop: "{{ audit_metadata_raw.stdout_lines }}"
    when: item | length > 0

  - name: Build structured audit results
    ansible.builtin.set_fact:
      audit_report_items: "{{ (audit_report_items | default([])) + [audit_report_item] }}"
    vars:
      audit_meta: "{{ audit_control_metadata.get(item.key, {}) }}"
      audit_stdout: "{{ item.value.stdout | default('') }}"
      audit_stderr: "{{ item.value.stderr | default('') }}"
      audit_rc: "{{ item.value.rc | default(0) | int }}"
      audit_status: >-
        {% if audit_stderr is search('syntax error|cannot statx|No such file or directory') or audit_rc >= 2 %}
        error
        {% elif audit_stdout is search('\\*\\* FAIL \\*\\*') %}
        fail
        {% elif audit_stdout is search('\\*\\* PASS \\*\\*') %}
        pass
        {% elif audit_rc == 0 and (audit_stderr | length == 0) %}
        pass
        {% else %}
        review
        {% endif %}
      audit_summary: >-
        {% if audit_stdout | length > 0 %}
        {{ audit_stdout | regex_replace('\r?\n+', ' ') | trim | truncate(180, True) }}
        {% elif audit_stderr | length > 0 %}
        {{ audit_stderr | regex_replace('\r?\n+', ' ') | trim | truncate(180, True) }}
        {% elif audit_rc != 0 %}
        Command returned rc={{ audit_rc }} without textual output.
        {% else %}
        Command completed without textual output.
        {% endif %}
      audit_report_item:
        register_name: "{{ item.key }}"
        control_id: "{{ audit_meta.control_id | default(item.key | regex_replace('^audit_', '') | regex_replace('_', '.')) }}"
        title: "{{ audit_meta.title | default(item.key) }}"
        rc: "{{ audit_rc }}"
        status: "{{ audit_status | trim }}"
        summary: "{{ audit_summary | trim }}"
        stdout: "{{ audit_stdout }}"
        stderr: "{{ audit_stderr }}"
        cmd: "{{ item.value.cmd | default('') }}"
        start: "{{ item.value.start | default('') }}"
        end: "{{ item.value.end | default('') }}"
        delta: "{{ item.value.delta | default('') }}"
    loop: "{{ vars | dict2items | selectattr('key', 'match', '^audit_[0-9_]+$') | sort(attribute='key') }}"

  - name: Build audit report summary
    ansible.builtin.set_fact:
      audit_report_summary:
        generated_at: "{{ ansible_date_time.iso8601 }}"
        inventory_hostname: "{{ inventory_hostname }}"
        total: "{{ audit_report_items | length }}"
        pass: "{{ audit_report_items | selectattr('status', 'equalto', 'pass') | list | length }}"
        fail: "{{ audit_report_items | selectattr('status', 'equalto', 'fail') | list | length }}"
        review: "{{ audit_report_items | selectattr('status', 'equalto', 'review') | list | length }}"
        error: "{{ audit_report_items | selectattr('status', 'equalto', 'error') | list | length }}"

  - name: Write structured audit JSON report
    ansible.builtin.copy:
      dest: "{{ audit_report_json_path }}"
      content: "{{ {'summary': audit_report_summary, 'items': audit_report_items} | to_nice_json }}"
      mode: "0644"
    delegate_to: localhost
    become: false

  - name: Render audit HTML report
    ansible.builtin.template:
      src: templates/cis-audit-report.html.j2
      dest: "{{ audit_report_html_path }}"
      mode: "0644"
    delegate_to: localhost
    become: false

  - name: Update latest audit JSON report
    ansible.builtin.copy:
      src: "{{ audit_report_json_path }}"
      dest: "{{ audit_report_artifact_dir }}/latest.json"
      remote_src: true
      mode: "0644"
    delegate_to: localhost
    become: false

  - name: Update latest audit HTML report
    ansible.builtin.copy:
      src: "{{ audit_report_html_path }}"
      dest: "{{ audit_report_artifact_dir }}/latest.html"
      remote_src: true
      mode: "0644"
    delegate_to: localhost
    become: false

  - name: Show generated audit report paths
    ansible.builtin.debug:
      msg:
        - "Audit JSON report: {{ audit_report_json_path }}"
        - "Audit HTML report: {{ audit_report_html_path }}"
        - "Latest HTML report: {{ audit_report_artifact_dir }}/latest.html"



