  - name: Audit 6.2.1.2 - Ensure journald log file access is configured
    tags:
    - Level1
    - Server
    - 6_2_1_2
    block:
    - name: Document audit intent for 6.2.1.2
      ansible.builtin.debug:
        msg: Ensure journald log file access is configured [6.2.1.2]
    - name: Execute audit commands for 6.2.1.2
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          #!/usr/bin/env bash

          {

          config_files=(/etc/tmpfiles.d/systemd.conf /usr/lib/tmpfiles.d/systemd.conf) 

          warn=()

          for file in "${config_files[@]}"; do
           [ -f "$file" ] || continue
           while read -r type path perm _; do
           if [[ "$type" == "f" && "$perm" =~ ^0?[0-7]{3,4}$ ]]; then
           perm="${perm#0}"
           if [ -f "$path" ]; then
           actual=$(stat -c "%a" "$path" 2>/dev/null)
           if [[ -n "$actual" && "$actual" -gt 640 ]]; then
           warn+=("File: $path | Perm: $actual (expected max: 640) | Defined in: $file")
           fi
           fi
           fi
           done < "$file"
          done

          if [ "${#warn[@]}" -eq 0 ]; then
           echo "No files with permissions more permissive than 0640."
          else
           echo -e " *** REVIEW ***"
           printf "%s\n" "${warn[@]}"
          fi

          }
          {% endraw %}
      args:
        executable: /bin/bash
      register: audit_6_2_1_2
      changed_when: false
      failed_when: false
