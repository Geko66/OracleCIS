  - name: Audit 5.1.1 - Ensure access to /etc/ssh/sshd_config is configured
    tags:
    - Level1
    - Server
    - 5_1_1
    block:
    - name: Document audit intent for 5.1.1
      ansible.builtin.debug:
        msg: Ensure access to /etc/ssh/sshd_config is configured [5.1.1]
    - name: Execute audit commands for 5.1.1
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          #!/usr/bin/env bash

          {
           a_output=(); a_output2=()
           perm_mask='0177' && maxperm="$( printf '%o' $(( 0777 & ~$perm_mask)) )"
           f_sshd_files_chk()
           {
           while IFS=: read -r l_mode l_user l_group; do
           a_out2=()
           [ $(( $l_mode & $perm_mask )) -gt 0 ] && a_out2+=(" Is mode: \"$l_mode\"" \
           " should be mode: \"$maxperm\" or more restrictive")
           [ "$l_user" != "root" ] && a_out2+=(" Is owned by \"$l_user\" should be owned by \"root\"")
           [ "$l_group" != "root" ] && a_out2+=(" Is group owned by \"$l_user\" should be group owned by \"root\"")
           if [ "${#a_out2[@]}" -gt "0" ]; then
           a_output2+=(" - File: \"$l_file\":" "${a_out2[@]}")
           else
           a_output+=(" - File: \"$l_file\":" " Correct: mode ($l_mode), owner ($l_user)" \
           " and group owner ($l_group) configured")
           fi
           done < <(stat -Lc '%#a:%U:%G' "$l_file") 
           }
           [ -e "/etc/ssh/sshd_config" ] && l_file="/etc/ssh/sshd_config" && f_sshd_files_chk
           while IFS= read -r -d $'\0' l_file; do
           [ -e "$l_file" ] && f_sshd_files_chk
           done < <(find /etc/ssh/sshd_config.d -type f -name '*.conf' \( -perm /077 -o ! -user root -o ! -group root \) -print0 2>/dev/null)
           if [ "${#a_output2[@]}" -le 0 ]; then
           printf '%s\n' "" "- Audit Result:" " ** PASS **" "${a_output[@]}" ""
           else
           printf '%s\n' "" "- Audit Result:" " ** FAIL **" " - Reason(s) for audit failure:" "${a_output2[@]}"
           [ "${#a_output[@]}" -gt 0 ] && printf '%s\n' "" "- Correctly set:" "${a_output[@]}" ""
           fi
          }
          {% endraw %}
      args:
        executable: /bin/bash
      register: audit_5_1_1
      changed_when: false
      failed_when: false
  - name: Audit 5.1.2 - Ensure access to SSH private host key files is configured
    tags:
    - Level1
    - Server
    - 5_1_2
    block:
    - name: Document audit intent for 5.1.2
      ansible.builtin.debug:
        msg: Ensure access to SSH private host key files is configured [5.1.2]
    - name: Execute audit commands for 5.1.2
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          #!/usr/bin/env bash

          {
           a_output=() a_output2=() l_ssh_group="" l_out="root"
           grep -Psiq -- '^\h*ID_LIKE=\"?([^#\n\r]+)?\bfedora\b' /etc/os-release && \
           l_ssh_group="$(grep -Pso -- '^ssh_keys\b' /etc/group)" && \
           l_out="$l_ssh_group or $l_out"
           f_file_chk()
           {
           while IFS=: read -r l_fmode l_fowner l_fgroup; do
           a_out2=()
           [ "$l_fgroup" = "$l_ssh_group" ] && l_pmask="0137" || l_pmask="0177"
           l_maxperm="$( printf '%o' $(( 0777 & ~$l_pmask )) )"
           if [ $(( $l_fmode & $l_pmask )) -gt 0 ]; then
           a_out2+=(" - mode: \"$l_fmode\"" \
           " should be mode: \"$l_maxperm\" or more restrictive")
           fi
           if [ "$l_fowner" != "root" ]; then
           a_out2+=(" - owned by: \"$l_fowner\"" \
           " should be owned by \"root\"")
           fi
           if [ "$l_fgroup" != "$l_ssh_group" ] && [ "$l_fgroup" != "root" ]; then
           a_out2+=(" - group owned by: \"$l_fgroup\"" \
           " should be group owned by: \"$l_out\"")
           fi
           if [ "${#a_out2[@]}" -gt "0" ]; then
           a_output2+=(" - File: \"$l_file\"" "${a_out2[@]}")
           else
           a_output+=(" - File: \"$l_file\" Correct:" \
           " - mode: \"$l_fmode\"" \
           " - owner: \"$l_fowner\"" " - group owner: \"$l_fgroup\"")
           fi
           done < <(stat -Lc '%#a:%U:%G' "$l_file")
           }
           while IFS= read -r -d $'\0' l_file; do 
           if ssh-keygen -lf &>/dev/null "$l_file"; then 
           file "$l_file"
           grep -Piq -- '\bopenssh\h+([^#\n\r]+\h+)?private\h+key\b' && f_file_chk
           fi
           done < <(find -L /etc/ssh -xdev -type f -print0 2>/dev/null)
           if [ "${#a_output2[@]}" -le 0 ]; then
           printf '%s\n' "" "- Audit Result:" " ** PASS **" "${a_output[@]}" ""
           else
           printf '%s\n' "" "- Audit Result:" " ** FAIL **" \
           " - Reason(s) for audit failure:" "${a_output2[@]}"
           [ "${#a_output[@]}" -gt 0 ] && \
           printf '%s\n' "" "- Correctly set:" "${a_output[@]}" ""
           fi
          }
          {% endraw %}
      args:
        executable: /bin/bash
      register: audit_5_1_2
      changed_when: false
      failed_when: false
