  - name: Remediate 1.1.1.1 - Ensure cramfs kernel module is not available
    tags:
    - Level1
    - Server
    - 1_1_1_1
    block:
    - name: Document remediation intent for 1.1.1.1
      ansible.builtin.debug:
        msg: Ensure cramfs kernel module is not available [1.1.1.1]
    - name: Execute remediation commands for 1.1.1.1
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          modprobe -r cramfs 2>/dev/null

          rmmod cramfs 2>/dev/null

          printf '%s\n' "" "install cramfs /bin/false" >> /etc/modprobe.d/60-cramfs.conf

          printf '%s\n' "" "blacklist cramfs" >> /etc/modprobe.d/60-cramfs.conf
          {% endraw %}
      args:
        executable: /bin/bash
      register: remediate_1_1_1_1
      changed_when: true
      failed_when: false
