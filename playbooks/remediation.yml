           {
           a_out2=()
           maxperm="$( printf '%o' $(( 0777 & ~$perm_mask)) )"
           if [ $(( $l_mode & $perm_mask )) -gt 0 ]; then
           a_out2+=(" o Mode: \"$l_mode\" should be \"$maxperm\" or more restrictive" " x Removing excess permissions")
