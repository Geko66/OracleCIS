  - name: Remediate 6.3.3.10 - Ensure use of privileged commands are collected
    tags:
    - Level2
    - Server
    - 6_3_3_10
    block:
    - name: Document remediation intent for 6.3.3.10
      ansible.builtin.debug:
        msg: Ensure use of privileged commands are collected [6.3.3.10]
    - name: Execute remediation commands for 6.3.3.10
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          #!/usr/bin/env bash

          {
           UID_MIN=$(awk '/^\s*UID_MIN/{print $2}' /etc/login.defs)
           AUDIT_RULE_FILE="/etc/audit/rules.d/50-privileged.rules"
           NEW_DATA=()
           for PARTITION in $(findmnt -n -l -k -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,) | grep -Pv "noexec|nosuid" | awk '{print $1}'); do
           readarray -t DATA < <(find "${PARTITION}" -xdev -perm /6000 -type f | awk -v UID_MIN=${UID_MIN} '{print "-a always,exit -F arch=b64 -S all -F path=" $1 " -F perm=x -F auid>="UID_MIN" -F auid!=unset -k privileged" }')
           for ENTRY in "${DATA[@]}"; do
           NEW_DATA+=("${ENTRY}")
           done
           done
           readarray &> /dev/null -t OLD_DATA < "${AUDIT_RULE_FILE}"
           COMBINED_DATA=( "${OLD_DATA[@]}" "${NEW_DATA[@]}" )
           printf '%s\n' "${COMBINED_DATA[@]}" | sort -u > "${AUDIT_RULE_FILE}"
          }

          # augenrules --load

          # if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot required to load rules\n"; fi
          {% endraw %}
      args:
        executable: /bin/bash
      register: remediate_6_3_3_10
      changed_when: true
      failed_when: false
