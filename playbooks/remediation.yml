           printf '%s\n' "" " - No access changes required" ""
           else
           printf '%s\n' " - Remediation results:" "${a_output2[@]}" ""
           fi
          }
          {% endraw %}
      args:
        executable: /bin/bash
      register: remediate_5_1_3
      changed_when: true
      failed_when: false
