---
- name: Install OpenSCAP packages
  ansible.builtin.package:
    name: "{{ oscap_required_packages }}"
    state: present
  tags:
    - oscap
    - packages

- name: Ensure OpenSCAP report directory exists
  ansible.builtin.file:
    path: "{{ oscap_report_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  tags:
    - oscap
    - config

- name: Deploy OpenSCAP scan wrapper
  ansible.builtin.template:
    src: oscap-scan.sh.j2
    dest: "{{ oscap_scan_script_path }}"
    owner: root
    group: root
    mode: "0750"
  tags:
    - oscap
    - config

- name: Deploy OpenSCAP systemd service
  ansible.builtin.template:
    src: oscap-cis-scan.service.j2
    dest: "/etc/systemd/system/{{ oscap_systemd_service_name }}"
    owner: root
    group: root
    mode: "0644"
  when: not oscap_use_cron | bool
  notify: Reload systemd
  tags:
    - oscap
    - schedule

- name: Deploy OpenSCAP systemd timer
  ansible.builtin.template:
    src: oscap-cis-scan.timer.j2
    dest: "/etc/systemd/system/{{ oscap_systemd_timer_name }}"
    owner: root
    group: root
    mode: "0644"
  when: not oscap_use_cron | bool
  notify: Reload systemd
  tags:
    - oscap
    - schedule

- name: Reload systemd before managing OpenSCAP timer
  ansible.builtin.meta: flush_handlers

- name: Remove cron schedule when systemd timer is used
  ansible.builtin.file:
    path: "{{ oscap_cron_file }}"
    state: absent
  when: not oscap_use_cron | bool
  tags:
    - oscap
    - schedule

- name: Enable and start OpenSCAP timer
  ansible.builtin.service:
    name: "{{ oscap_systemd_timer_name }}"
    enabled: "{{ oscap_enable_timer | bool }}"
    state: "{{ 'started' if oscap_enable_timer | bool else 'stopped' }}"
  when: not oscap_use_cron | bool
  tags:
    - oscap
    - schedule

- name: Deploy OpenSCAP cron schedule
  ansible.builtin.template:
    src: oscap-cis-scan.cron.j2
    dest: "{{ oscap_cron_file }}"
    owner: root
    group: root
    mode: "0644"
  when: oscap_use_cron | bool
  tags:
    - oscap
    - schedule

- name: Disable OpenSCAP timer when cron is selected
  ansible.builtin.service:
    name: "{{ oscap_systemd_timer_name }}"
    enabled: false
    state: stopped
  when: oscap_use_cron | bool
  failed_when: false
  tags:
    - oscap
    - schedule

- name: Run an immediate OpenSCAP scan
  ansible.builtin.command:
    cmd: "{{ oscap_scan_script_path }}"
  register: oscap_immediate_scan
  changed_when: oscap_apply_remediation_during_scan | bool
  failed_when: oscap_immediate_scan.rc not in [0, 2]
  when: oscap_run_immediate_scan | bool
  tags:
    - oscap
    - scan

- name: Read OpenSCAP execution manifest
  ansible.builtin.slurp:
    src: "{{ oscap_manifest_path }}"
  register: oscap_manifest_raw
  when:
    - oscap_run_immediate_scan | bool
    - oscap_collect_artifacts | bool
    - oscap_local_artifact_dir | length > 0
  tags:
    - oscap
    - artifacts

- name: Parse OpenSCAP execution manifest
  ansible.builtin.set_fact:
    oscap_manifest_content: "{{ oscap_manifest_raw.content | b64decode }}"
    oscap_manifest_map: >-
      {{
        dict(
          (
            oscap_manifest_raw.content
            | b64decode
            | split('\n')
            | select('match', '^[A-Z_]+=')
            | map('split', '=', 1)
          )
        )
      }}
  when:
    - oscap_run_immediate_scan | bool
    - oscap_collect_artifacts | bool
    - oscap_local_artifact_dir | length > 0
  tags:
    - oscap
    - artifacts

- name: Ensure local artifact directory exists
  ansible.builtin.file:
    path: "{{ oscap_local_artifact_dir }}/{{ inventory_hostname }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  when:
    - oscap_run_immediate_scan | bool
    - oscap_collect_artifacts | bool
    - oscap_local_artifact_dir | length > 0
  tags:
    - oscap
    - artifacts

- name: Copy OpenSCAP manifest to the local artifacts directory
  ansible.builtin.copy:
    dest: "{{ oscap_local_artifact_dir }}/{{ inventory_hostname }}/latest.env"
    content: "{{ oscap_manifest_content }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when:
    - oscap_run_immediate_scan | bool
    - oscap_collect_artifacts | bool
    - oscap_local_artifact_dir | length > 0
  tags:
    - oscap
    - artifacts

- name: Fetch OpenSCAP output artifacts
  ansible.builtin.fetch:
    src: "{{ item }}"
    dest: "{{ oscap_local_artifact_dir }}/{{ inventory_hostname }}/"
    flat: true
  loop: >-
    {{
      [
        oscap_manifest_map.HTML_REPORT | default(''),
        oscap_manifest_map.XML_RESULTS | default(''),
        oscap_manifest_map.CONSOLE_LOG | default(''),
        oscap_manifest_map.ANSIBLE_FIX | default(''),
        oscap_manifest_map.BASH_FIX | default('')
      ]
      | reject('equalto', '')
      | list
    }}
  when:
    - oscap_run_immediate_scan | bool
    - oscap_collect_artifacts | bool
    - oscap_local_artifact_dir | length > 0
  tags:
    - oscap
    - artifacts
